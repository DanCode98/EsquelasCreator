<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Paloma de la paz estilo line-art tradicional funerario -->
  <g fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cabeza y Pico -->
    <path d="M 170,110 C 165,100 170,90 180,88 C 190,86 195,95 190,105 C 185,115 175,120 165,125" />
    <path d="M 183,92 L 198,96 L 184,100 Z" fill="#1e293b" />
    <circle cx="180" cy="94" r="1.5" fill="#1e293b" />

    <!-- Rama de olivo en el pico -->
    <path d="M 190,98 Q 230,85 245,65" stroke="#1e293b" stroke-width="2.5" />
    <!-- Hojas de la rama -->
    <path d="M 205,92 C 205,82 215,82 215,92 C 215,92 205,92 205,92 Z" fill="#1e293b" />
    <path d="M 218,84 C 218,74 228,74 228,84 C 228,84 218,84 218,84 Z" fill="#1e293b" />
    <path d="M 230,76 C 230,66 240,66 240,76 C 240,76 230,76 230,76 Z" fill="#1e293b" />
    <path d="M 242,68 C 242,58 252,58 252,68 C 252,68 242,68 242,68 Z" fill="#1e293b" />

    <!-- Pecho y cuerpo -->
    <path d="M 165,125 C 150,135 130,145 110,140 C 95,135 85,120 80,100 C 78,80 85,60 100,50" />

    <!-- Ala derecha elevada con plumas detalladas -->
    <path d="M 140,110 C 135,70 120,40 100,30 C 90,25 80,30 85,45 C 90,55 95,65 95,75" />
    <path d="M 100,30 C 85,35 75,50 80,65" />
    <path d="M 85,45 C 70,55 65,70 70,85" />
    <path d="M 75,65 C 60,80 58,95 65,110" />
    <path d="M 70,85 C 55,100 55,115 65,130" />

    <!-- Ala izquierda inferior -->
    <path d="M 155,120 C 145,100 135,85 125,75" />
    <path d="M 145,100 C 130,105 120,115 125,130" />

    <!-- Cola elegante -->
    <path d="M 85,120 C 65,135 50,155 45,175 C 55,175 70,165 85,150" />
    <path d="M 45,175 C 40,185 50,185 60,175 C 75,160 85,145 95,135" />
  </g>
</svg>
