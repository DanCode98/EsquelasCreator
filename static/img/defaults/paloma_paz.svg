<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="palomaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#dfb12e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="170" fill="url(#palomaGlow)"/>
  <!-- Rayos de luz -->
  <g stroke="#dfb12e" stroke-width="1.2" opacity="0.4">
    <line x1="200" y1="50" x2="200" y2="350"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="90" y1="90" x2="310" y2="310"/>
    <line x1="90" y1="310" x2="310" y2="90"/>
  </g>
  <!-- Paloma estilizada de la paz -->
  <g fill="url(#wingGrad)" stroke="#94a3b8" stroke-width="1.5" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">
    <!-- Ala izquierda extendida -->
    <path d="M 190,190 C 140,110 80,100 70,120 C 60,140 100,180 160,200 Z"/>
    <!-- Ala derecha superior -->
    <path d="M 210,190 C 240,100 310,80 330,100 C 340,120 280,170 230,205 Z"/>
    <!-- Cuerpo y cola -->
    <path d="M 175,185 C 190,165 215,165 225,185 C 235,210 220,260 200,290 C 180,260 165,210 175,185 Z"/>
    <!-- Cabeza -->
    <circle cx="200" cy="155" r="14" fill="#ffffff"/>
    <!-- Pico -->
    <polygon points="200,143 194,133 206,133" fill="#dfb12e" stroke="#c29221" stroke-width="1"/>
  </g>
  <!-- Rama de olivo dorada en el pico -->
  <path d="M 200,135 Q 230,120 240,100" fill="none" stroke="#dfb12e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="215" cy="123" r="3" fill="#dfb12e"/>
  <circle cx="228" cy="113" r="3" fill="#dfb12e"/>
  <circle cx="238" cy="102" r="3" fill="#dfb12e"/>
</svg>
