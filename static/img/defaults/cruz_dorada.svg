<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="haloGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8c6d1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#6e5000"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Aura de fondo -->
  <circle cx="200" cy="200" r="180" fill="url(#haloGold)"/>
  
  <!-- Resplandor Rayos de Luz -->
  <g stroke="#d4af37" stroke-width="1.5" opacity="0.35">
    <line x1="200" y1="30" x2="200" y2="370" />
    <line x1="30" y1="200" x2="370" y2="200" />
    <line x1="80" y1="80" x2="320" y2="320" />
    <line x1="80" y1="320" x2="320" y2="80" />
  </g>
  
  <!-- Cruz Solemne -->
  <g filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.35))">
    <!-- Poste vertical -->
    <rect x="185" y="60" width="30" height="280" rx="4" fill="url(#goldGrad)" stroke="#574100" stroke-width="1.5"/>
    <!-- Brazo horizontal -->
    <rect x="110" y="125" width="180" height="30" rx="4" fill="url(#goldGrad)" stroke="#574100" stroke-width="1.5"/>
    
    <!-- Remates ornamentales en las puntas -->
    <circle cx="200" cy="60" r="10" fill="url(#goldGrad)" stroke="#574100" stroke-width="1.5"/>
    <circle cx="200" cy="340" r="10" fill="url(#goldGrad)" stroke="#574100" stroke-width="1.5"/>
    <circle cx="110" cy="140" r="10" fill="url(#goldGrad)" stroke="#574100" stroke-width="1.5"/>
    <circle cx="290" cy="140" r="10" fill="url(#goldGrad)" stroke="#574100" stroke-width="1.5"/>
    
    <!-- Centro con resplandor circular / Santo Rosario central -->
    <circle cx="200" cy="140" r="22" fill="none" stroke="#fdf3cd" stroke-width="3"/>
    <circle cx="200" cy="140" r="14" fill="url(#goldGrad)" stroke="#574100" stroke-width="1"/>
    
    <!-- Corona de espinas / corona triunfal estilizada -->
    <path d="M 180,140 A 20,20 0 1,0 220,140 A 20,20 0 1,0 180,140" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Hojas de olivo / laureles de paz eterna -->
  <path d="M 155,270 C 135,250 135,210 150,180 C 160,210 170,240 185,260" fill="none" stroke="#c29b27" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 245,270 C 265,250 265,210 250,180 C 240,210 230,240 215,260" fill="none" stroke="#c29b27" stroke-width="2.5" stroke-linecap="round"/>
</svg>
