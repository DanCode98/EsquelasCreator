<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="haloJesus" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="tunicaBlanca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mantoRojo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="corazonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo con cruz cruciforme -->
  <circle cx="200" cy="130" r="95" fill="url(#haloJesus)"/>
  <circle cx="200" cy="130" r="75" fill="none" stroke="#d97706" stroke-width="2"/>
  <!-- Cruz cruciforme en el halo -->
  <rect x="195" y="45" width="10" height="40" fill="#d97706"/>
  <rect x="130" y="125" width="40" height="10" fill="#d97706"/>
  <rect x="230" y="125" width="40" height="10" fill="#d97706"/>

  <!-- Túnica y Manto -->
  <path d="M 200,165 L 140,240 L 120,460 L 280,460 L 260,240 Z" fill="url(#tunicaBlanca)"/>
  <path d="M 140,240 C 130,320 140,420 160,460 L 120,460 C 110,380 120,280 140,240 Z" fill="url(#mantoRojo)"/>
  <path d="M 260,240 C 270,320 260,420 240,460 L 280,460 C 290,380 280,280 260,240 Z" fill="url(#mantoRojo)"/>

  <!-- Rostro de Jesús -->
  <circle cx="200" cy="130" r="30" fill="#fed7aa"/>
  <path d="M 180,135 C 180,175 220,175 220,135 Z" fill="#5c2c16"/>
  <ellipse cx="200" cy="125" rx="24" ry="18" fill="#fed7aa"/>
  <path d="M 175,120 C 180,95 220,95 225,120 C 220,105 180,105 175,120 Z" fill="#5c2c16"/>

  <!-- Resplandor del Sagrado Corazón -->
  <circle cx="200" cy="270" r="60" fill="url(#corazonGlow)"/>

  <!-- Sagrado Corazón -->
  <g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.35))">
    <!-- Corazón ardiente -->
    <path d="M 200,295 C 165,260 165,225 185,225 C 195,225 200,235 200,235 C 200,235 205,225 215,225 C 235,225 235,260 200,295 Z" fill="#b91c1c" stroke="#f87171" stroke-width="1.5"/>
    
    <!-- Llama sobre el corazón -->
    <path d="M 200,210 C 190,225 195,230 200,230 C 205,230 210,225 200,210 Z" fill="#fbbf24"/>
    <path d="M 200,218 C 195,226 198,229 200,229 C 202,229 205,226 200,218 Z" fill="#ffffff"/>

    <!-- Cruz sobre la llama -->
    <rect x="198" y="195" width="4" height="20" fill="#78350f"/>
    <rect x="193" y="200" width="14" height="4" fill="#78350f"/>

    <!-- Corona de espinas alrededor del corazón -->
    <ellipse cx="200" cy="255" rx="24" ry="7" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Mano señalando al corazón -->
  <circle cx="170" cy="285" r="10" fill="#fed7aa"/>
  <circle cx="230" cy="285" r="10" fill="#fed7aa"/>
</svg>
