<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="judasHalo" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="tunicaVerde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="mantoBlanco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="medallonOro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <!-- Halo de santidad -->
  <circle cx="200" cy="130" r="100" fill="url(#judasHalo)"/>
  <circle cx="200" cy="130" r="75" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- Llama de fuego de Pentecostés en la cabeza -->
  <path d="M 200,45 C 190,65 192,80 200,80 C 208,80 210,65 200,45 Z" fill="#ef4444" filter="drop-shadow(0 0 8px #f59e0b)"/>
  <path d="M 200,55 C 195,68 196,75 200,75 C 204,75 205,68 200,55 Z" fill="#fef08a"/>

  <!-- Túnica Verde -->
  <path d="M 200,160 L 140,240 L 120,460 L 280,460 L 260,240 Z" fill="url(#tunicaVerde)"/>
  
  <!-- Manto Blanco drapeado -->
  <path d="M 160,180 C 130,220 120,320 140,460 L 210,460 C 200,340 180,240 160,180 Z" fill="url(#mantoBlanco)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Bastón / Báculo de apóstol en mano izquierda -->
  <line x1="260" y1="120" x2="270" y2="470" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
  <circle cx="260" cy="115" r="9" fill="#92400e"/>

  <!-- Rostro y barba -->
  <circle cx="200" cy="130" r="32" fill="#fed7aa"/>
  <path d="M 180,135 C 180,175 220,175 220,135 Z" fill="#78350f"/> <!-- Barba -->
  <ellipse cx="200" cy="125" rx="26" ry="18" fill="#fed7aa"/>
  <path d="M 175,120 C 180,95 220,95 225,120 Z" fill="#78350f"/> <!-- Cabello -->

  <!-- Medallón con la efigie de Cristo (Mandylion de Edesa) en el pecho -->
  <circle cx="200" cy="240" r="34" fill="url(#medallonOro)" stroke="#713f12" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
  <circle cx="200" cy="240" r="26" fill="#fef08a"/>
  <!-- Rostro de Jesús grabado en el medallón -->
  <circle cx="200" cy="235" r="12" fill="#ca8a04"/>
  <path d="M 194,238 C 194,248 206,248 206,238 Z" fill="#854d0e"/>
  
  <!-- Cinta que sostiene el medallón -->
  <path d="M 180,180 L 195,215" stroke="#ca8a04" stroke-width="3"/>
  <path d="M 220,180 L 205,215" stroke="#ca8a04" stroke-width="3"/>
</svg>
